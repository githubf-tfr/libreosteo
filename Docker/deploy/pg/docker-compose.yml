services:
# Images du fork, epinglees par une variable obligatoire : sans LIBREOSTEO_IMAGE_TAG,
# `docker compose` refuse de demarrer avec un message, au lieu de retomber sur :latest.
# Le namespace est `familletra/`, celui du fork, et non `libreosteo/`, qui est celui du
# depot Docker Hub AMONT. C'est ce changement de nom qui a permis de retirer le
# `pull_policy: never` d'origine : il n'etait la que parce que les deux noms se
# confondaient et qu'un tirage aurait descendu le binaire d'amont sous le nom du fork.
# Le tirage est desormais legitime — une machine qui n'a pas bati les images recupere
# celles que ce depot a poussees.
# Convention : batir les deux images sous le commit court du depot,
# `git rev-parse --short HEAD` — c'est ce qui rend « quelle image tourne » repondable.
  db:
    image: "familletra/libreosteo-pg:${LIBREOSTEO_IMAGE_TAG:?renseigner LIBREOSTEO_IMAGE_TAG, cf. Docker/deploy/pg/.env.example}"
    hostname: pg_1
    volumes:
      # Monte sur /var/lib/postgresql, et non sur .../data : depuis PostgreSQL 18,
      # l'image officielle range le repertoire de donnees par version majeure
      # (PGDATA=/var/lib/postgresql/18/docker, VOLUME /var/lib/postgresql). Monter
      # l'ancien chemin ferait initialiser un cluster neuf A COTE des anciens fichiers,
      # sans un mot. Le repertoire hote porte donc desormais un sous-repertoire 18/,
      # cree par l'entrypoint et appartenant a root, qui contient 18/docker (uid 70).
      # C'est ce rangement par majeure qui rendra les montees suivantes praticables en
      # `pg_upgrade --link` ; la montee 13 -> 18 elle-meme passe par un dump, cf. README.
      - ${LIBREOSTEO_DB_STORAGE}:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
      - ${LIBREOSTEO_BAK_STORAGE}:/var/lib/backup
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=libreosteo
    # Sonde TCP, et non la socket Unix : pendant initdb, l'entrypoint officiel de l'image
    # PostgreSQL lance un serveur temporaire avec listen_addresses='', qui n'ecoute que la
    # socket Unix. Un `pg_isready` sans -h interroge cette socket et repond « accepting
    # connections » alors qu'aucune connexion TCP n'est encore possible : c'est ce faux
    # positif qui rendait le contournement manuel du chapitre 0 insuffisant. Le -h 127.0.0.1
    # est donc le coeur du correctif, pas un detail.
    # Les $$ echappent l'interpolation de compose : les variables sont resolues par le shell
    # du conteneur, qui les recoit par `environment` ci-dessus.
    # 30s de grace puis 24 essais toutes les 5s : deux minutes de tolerance, tres au-dela des
    # initdb observes, et un echec franc au-dela.
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24
  libreosteo:
    image: "familletra/libreosteo-http:${LIBREOSTEO_IMAGE_TAG:?renseigner LIBREOSTEO_IMAGE_TAG, cf. Docker/deploy/pg/.env.example}"
    hostname: libreosteo_1
    ports:
      - "8085:8085"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - LIBREOSTEO_SECRET_KEY=${LIBREOSTEO_SECRET_KEY}
      - LIBREOSTEO_ALLOWED_HOSTS=${LIBREOSTEO_ALLOWED_HOSTS}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA}:/Libreosteo/data
      - ${SETTINGS}:/Libreosteo/settings
