name: Libreosteo Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt
          pip install -r requirements/requ-dev.txt
      - name: Quality (lint + migrations + tests)
        # Meme raison que le job `functional` pour `make static PYTHON=python` :
        # ce job n'a pas de .venv, tout est installe dans l'interpreteur courant.
        # `check` = `lint migrations-check test` (Makefile) = les trois anciennes
        # etapes, dans le meme ordre, via une seule cible au lieu de trois copies.
        run: make check PYTHON=python

  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install tooling
        run: |
          # Meme raison que dans Docker/build/http-ready/Dockerfile : le script amont
          # abandonne la signature en silence quand gpg manque, et il s'execute lui-meme
          # sans qu'un seul de ses octets ait ete verifie. Tarball + somme SHA-256 codee ici.
          #
          # La garde ci-dessous est bloquante : GitHub Actions execute un `run:` shell via
          # `bash -eo pipefail`, donc un `sha256sum -c` qui echoue dans le pipe suivant fait
          # echouer toute l'etape, avant `tar`. `set -eo pipefail` est repete ici en toutes
          # lettres, bien que deja actif par defaut, pour que ce blocage se lise sans
          # connaitre cette convention de GitHub Actions (renvoye par D5, KANBAN).
          set -eo pipefail
          curl -fsSL -o /tmp/yarn.tar.gz https://github.com/yarnpkg/yarn/releases/download/v1.21.1/yarn-v1.21.1.tar.gz
          echo "d1d9f4a0f16f5ed484e814afeb98f39b82d4728c6c8beaafb5abc99c02db6674  /tmp/yarn.tar.gz" | sha256sum -c -
          tar -xzf /tmp/yarn.tar.gz -C /tmp
          mv /tmp/yarn-v1.21.1 "$HOME/.yarn"
          rm /tmp/yarn.tar.gz
          sudo apt install gettext
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt
          pip install -r requirements/requ-testing.txt
          playwright install --with-deps chromium
      - name: Prepare the static tree
        # A3 : une seule definition de la preparation de l'arbre, deux appelants. La cible
        # est Makefile:static, la meme qu'en local. PYTHON=python parce que ce job n'a pas
        # de .venv : setup-python + pip install ont tout mis dans l'interpreteur courant.
        # YARN se resout seul sur $HOME/.yarn/bin/yarn, pose par l'etape Install tooling.
        run: make static PYTHON=python
      - name: Verify the static tree contract
        # tests/qualite/test_contrat_arbre_statique.py porte deux tests en egalite
        # d'ensemble qui se `skip` tant que `static/` n'existe pas (cf. le docstring du
        # module) : le job `quality` ne construit jamais l'arbre, donc ne les fait
        # jamais mordre. Ce job vient de le construire (etape precedente) pour
        # `tests/functional` ; on y fait tourner le module ici, une seule fois, sans
        # reconstruire l'arbre ni relancer `tests/functional`.
        run: pytest tests/qualite/test_contrat_arbre_statique.py --no-cov -rs
      - name: Run functional tests
        run: |
          pytest tests/functional --no-cov \
            --tracing=retain-on-failure --screenshot=only-on-failure \
            --output=test-results
      - name: Archiving results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: result-tests
          path: |
            test-results/**
