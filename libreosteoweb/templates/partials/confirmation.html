{% load i18n %}
<div class="modal-header">
    <h3 class="modal-title">{% trans 'Confirm' %}</h3>
</div>
<form novalidate name="form">
<div class="modal-body">
  <div bind-html-compile="message"></div>
  <!-- Donnees patient : jamais dans "message" (compile par bind-html-compile), toujours
       liees ici en texte -- ng-repeat et interpolation Angular echappent seules, sans
       passer par $sce.trustAsHtml. Delimiteurs Angular custom (app.js,
       $interpolateProvider) : les accolades doubles par defaut sont celles de Django,
       qui lit ce gabarit avant le navigateur. -->
  <ul ng-if="homonymes.length">
    <li ng-repeat="h in homonymes">{$ h.family_name $} {$ h.first_name $} — {$ h.birth_date | date:'longDate' $}</li>
  </ul>
</div>
<div class="modal-footer">
    <button id="modal-btn-ok" class="btn btn-primary" ng-click="ok()" ng-disabled="form.$invalid || !isOk">{% trans 'Ok' %}</button>
    <button id="modal-btn-cancel" class="btn btn-danger" ng-click="cancel()">{% trans 'Cancel' %}</button>
</div>
</form>
