# Configuration de l'outillage de qualité uniquement.
# L'emballage du paquet reste décrit par setup.py et setup.cfg.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "Libreosteo.settings"
testpaths = ["libreosteoweb/tests", "zipcode_lookup"]
python_files = ["test_*.py", "tests.py"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["libreosteoweb"]
omit = [
    "libreosteoweb/migrations/*",
    "libreosteoweb/tests/*",
]

[tool.coverage.report]
# Plancher à cliquet : cette valeur ne descend jamais. Quand la couverture
# progresse durablement, on relève le plancher dans le commit qui l'a fait monter.
# Descendu de 62 à 61 une seule fois, en activant ruff : la suppression des imports
# morts retire des lignes couvertes, donc rétrécit le dénominateur (62,07 % sur
# 2494 lignes, 61,94 % sur 2483). Aucun test perdu, aucune ligne nouvellement
# découverte — c'est le dénominateur qui a bougé, pas la couverture réelle.
# 2026-08-30 : relevé à 64 par le lot 1 de S2 (facturation), couverture constatée 64,68 %.
# 2026-08-30 : relevé à 66 par le lot 2 de S2 (accès et session), couverture constatée 66,81 %.
# 2026-08-30 : relevé à 72 par le lot 3 de S2 (dossier patient), couverture constatée 72,34 %.
# 2026-08-31 : relevé à 80 par le lot 4 de S2 (import de fichiers), couverture constatée 80,55 %.
# 2026-08-31 : relevé à 89 à la clôture de S2 (lot 5), couverture constatée 89,24 %.
fail_under = 89

[tool.ruff]
target-version = "py313"
extend-exclude = ["libreosteoweb/migrations", "node_modules", ".venv", ".tools"]

[tool.ruff.lint]
# Jeu de départ volontairement étroit : erreurs de logique (F), erreurs de syntaxe
# et de sémantique (E4, E7, E9) et tri des imports (I). Il s'élargit au même
# principe de cliquet que le plancher de couverture.
select = ["E4", "E7", "E9", "F", "I"]
# Dette soldée par S2 : les 17 `except:` nus ont été remplacés par les exceptions réellement
# attendues, et seul un import hors en-tête (`Libreosteo/wsgi.py`) reste justifié par un
# `noqa: E402` en ligne — les six autres ont été ramenés en tête de fichier, un audit ayant
# prouvé que leur dépendance déclarée n'existait pas. Cette liste doit rester vide.
ignore = []

[tool.ruff.lint.per-file-ignores]
# Les modules de réglages sont bâtis sur `from .base import *`, motif voulu par Django.
"Libreosteo/settings/*.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
# Périmètre volontairement restreint : seuls les modules qui passent déjà figurent
# ici. Un module rejoint la liste quand il est annoté. Même cliquet que la couverture.
# 2026-08-31 (clôture de S2) : les quatre candidats des lots 4 et 5 mesurés, aucun ne passe.
# `libreosteoweb/api/utils.py` échoue seul sur 3 erreurs (`_instances` sans annotation à la
# ligne 34, `unicode` non défini — résidu Python 2 — aux lignes 43 et 44, dans du code non
# couvert). `statistics.py`, `events/settings.py` et `management/commands/backup_db.py`
# héritent ces 3 erreurs par leurs imports, plus `models.py:181` et `:389` (annotation
# manquante) et `Libreosteo/settings/dev.py:18` (affectation indexée non supportée) : 6
# erreurs chacun. Aucun ne peut rejoindre le périmètre avant que `models.py` soit annoté et
# le résidu `unicode` retiré — ne pas remesurer sans que l'un de ces deux préalables ait bougé.
files = [
    "Libreosteo/__init__.py",
    "libreosteoweb/__init__.py",
    "libreosteoweb/api/__init__.py",
    "libreosteoweb/api/events/__init__.py",
    "libreosteoweb/api/exceptions.py",
    "libreosteoweb/api/filter.py",
    "libreosteoweb/api/folding_whoosh_backend.py",
    "libreosteoweb/api/invoicing/__init__.py",
    "libreosteoweb/api/renderers.py",
    "libreosteoweb/api/signals.py",
    "libreosteoweb/api/validators.py",
    "libreosteoweb/api/version/__init__.py",
    "libreosteoweb/api/version/version.py",
    "libreosteoweb/templatetags/__init__.py",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "Libreosteo.settings"
